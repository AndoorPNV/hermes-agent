<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ядро — прототип виджета</title>
<style>
  html, body { margin: 0; background: #05080c; overflow: hidden; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c" width="440" height="420"></canvas>
<script>
(() => {
  const cv = document.getElementById('c')
  const ctx = cv.getContext('2d')
  const W = cv.width, H = cv.height
  const CX = W / 2, CY = 186, R = 118          // центр кристалла и его радиус
  const BASE_Y = 356, BASE_RX = 118, BASE_RY = 30

  // ── value noise 3D (детерминированный) ──────────────────────────────────
  function hash3(i, j, k) {
    let n = (i * 374761393 + j * 668265263 + k * 1274126177) | 0
    n = (n ^ (n >> 13)) * 1274126177 | 0
    return ((n ^ (n >> 16)) >>> 0) / 4294967295
  }
  const sm = t => t * t * (3 - 2 * t)
  function noise3(x, y, z) {
    const i = Math.floor(x), j = Math.floor(y), k = Math.floor(z)
    const fx = sm(x - i), fy = sm(y - j), fz = sm(z - k)
    const l = (a, b, t) => a + (b - a) * t
    const c = (di, dj, dk) => hash3(i + di, j + dj, k + dk)
    return l(
      l(l(c(0,0,0), c(1,0,0), fx), l(c(0,1,0), c(1,1,0), fx), fy),
      l(l(c(0,0,1), c(1,0,1), fx), l(c(0,1,1), c(1,1,1), fx), fy),
      fz)
  }

  // ── меш: икосаэдр → 2 подразбиения → радиальное смещение + нижний остриё ─
  const T = (1 + Math.sqrt(5)) / 2
  let verts = [[-1,T,0],[1,T,0],[-1,-T,0],[1,-T,0],[0,-1,T],[0,1,T],[0,-1,-T],[0,1,-T],[T,0,-1],[T,0,1],[-T,0,-1],[-T,0,1]]
  let faces = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
               [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]]

  function subdivide(v, f) {
    const mid = new Map(), nv = v.slice(), nf = []
    const key = (a, b) => a < b ? a + ':' + b : b + ':' + a
    const get = (a, b) => {
      const k = key(a, b)
      if (mid.has(k)) return mid.get(k)
      const p = [(v[a][0]+v[b][0])/2, (v[a][1]+v[b][1])/2, (v[a][2]+v[b][2])/2]
      nv.push(p); mid.set(k, nv.length - 1); return nv.length - 1
    }
    for (const [a, b, c] of f) {
      const ab = get(a,b), bc = get(b,c), ca = get(c,a)
      nf.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca])
    }
    return [nv, nf]
  }
  ;[verts, faces] = subdivide(verts, faces)
  ;[verts, faces] = subdivide(verts, faces)

  // нормализуем и деформируем
  const P = verts.map(([x, y, z]) => {
    const len = Math.hypot(x, y, z)
    let ux = x/len, uy = y/len, uz = z/len
    const n = noise3(ux*2.7 + 11, uy*2.7 + 4, uz*2.7 + 7)*0.62 +
              noise3(ux*5.4 + 3, uy*5.4 + 9, uz*5.4 + 1)*0.38
    let r = 1 + (n - 0.5) * 0.30
    let px = ux*r, py = uy*r*1.02, pz = uz*r
    // нижний острый наконечник
    if (py < -0.25) {
      const t = Math.min(1, (-py - 0.25) / 0.75)
      const k = 1 - t*0.94
      px *= k; pz *= k; py = -0.25 - t*0.95 - t*t*0.35
    }
    return [px, py, pz]
  })

  // рёбра «трещин» от центра к поверхности
  const veins = []
  for (let i = 0; i < 18; i++) {
    const idx = Math.floor(hash3(i, 7, 3) * P.length)
    veins.push(P[idx])
  }

  // ── рендер ───────────────────────────────────────────────────────────────
  let t0 = performance.now(), pulse = 0, hover = false
  cv.addEventListener('pointerdown', () => { pulse = 1 })
  cv.addEventListener('pointerenter', () => { hover = true })
  cv.addEventListener('pointerleave', () => { hover = false })

  const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l] }
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]
  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2]
  const L = norm([-0.45, -0.62, 0.85])

  function drawBase(glow) {
    const g = ctx.createLinearGradient(0, BASE_Y - BASE_RY, 0, BASE_Y + BASE_RY * 1.4)
    g.addColorStop(0, '#39434a'); g.addColorStop(1, '#1b2227')

    // тень/свечение под основанием
    ctx.save()
    ctx.globalCompositeOperation = 'lighter'
    const sg = ctx.createRadialGradient(CX, BASE_Y + 10, 0, CX, BASE_Y + 10, BASE_RX * 1.5)
    sg.addColorStop(0, `rgba(0,180,235,${0.16 * glow})`)
    sg.addColorStop(1, 'rgba(0,180,235,0)')
    ctx.fillStyle = sg
    ctx.beginPath(); ctx.ellipse(CX, BASE_Y + 12, BASE_RX * 1.5, BASE_RY * 2.0, 0, 0, Math.PI*2); ctx.fill()
    ctx.restore()

    // боковина
    ctx.beginPath()
    ctx.ellipse(CX, BASE_Y + 16, BASE_RX, BASE_RY, 0, 0, Math.PI*2)
    ctx.fillStyle = g
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 24
    ctx.fill()
    ctx.shadowBlur = 0

    // верхняя плита
    const tg = ctx.createLinearGradient(CX - BASE_RX, BASE_Y, CX + BASE_RX, BASE_Y + BASE_RY)
    tg.addColorStop(0, '#4d5860'); tg.addColorStop(0.5, '#5b666e'); tg.addColorStop(1, '#39434a')
    ctx.beginPath()
    ctx.ellipse(CX, BASE_Y, BASE_RX, BASE_RY, 0, 0, Math.PI*2)
    ctx.fillStyle = tg
    ctx.fill()

    // внутренний диск
    ctx.beginPath()
    ctx.ellipse(CX, BASE_Y, BASE_RX * 0.78, BASE_RY * 0.78, 0, 0, Math.PI*2)
    ctx.fillStyle = '#242c31'
    ctx.fill()

    // светящееся кольцо
    ctx.save()
    ctx.globalCompositeOperation = 'lighter'
    ctx.strokeStyle = `rgba(80,240,255,${0.55 + 0.25 * glow})`
    ctx.lineWidth = 2
    ctx.shadowColor = 'rgba(0,220,255,0.9)'; ctx.shadowBlur = 18
    ctx.beginPath()
    ctx.ellipse(CX, BASE_Y, BASE_RX * 0.66, BASE_RY * 0.66, 0, 0, Math.PI*2)
    ctx.stroke()
    ctx.restore()

    // передний слот + светодиоды
    const sy = BASE_Y + 20
    ctx.beginPath()
    ctx.roundRect(CX - 26, sy, 52, 11, 4)
    ctx.fillStyle = '#0e1418'; ctx.fill()
    ctx.strokeStyle = 'rgba(120,140,150,0.35)'; ctx.lineWidth = 1; ctx.stroke()

    ctx.save()
    ctx.globalCompositeOperation = 'lighter'
    for (const dx of [-40, 40]) {
      const lg = ctx.createRadialGradient(CX + dx, sy + 9, 0, CX + dx, sy + 9, 9)
      lg.addColorStop(0, `rgba(255,255,255,${0.95 * glow})`)
      lg.addColorStop(0.35, `rgba(140,245,255,${0.55 * glow})`)
      lg.addColorStop(1, 'rgba(0,200,255,0)')
      ctx.fillStyle = lg
      ctx.beginPath(); ctx.arc(CX + dx, sy + 9, 9, 0, Math.PI*2); ctx.fill()
    }
    ctx.restore()
  }

  function frame(now) {
    const t = (now - t0) / 1000
    pulse *= 0.94
    const glow = 0.62 + 0.14 * Math.sin(t * 1.9) + pulse * 0.5

    ctx.clearRect(0, 0, W, H)
    const bg = ctx.createRadialGradient(CX, CY, 20, CX, CY, W * 0.75)
    bg.addColorStop(0, '#0a1420'); bg.addColorStop(1, '#05080c')
    ctx.fillStyle = bg
    ctx.fillRect(0, 0, W, H)

    const bob = Math.sin(t * 1.35) * 5           // левитация
    const cy = CY + bob

    // аура
    ctx.save()
    ctx.globalCompositeOperation = 'lighter'
    const ag = ctx.createRadialGradient(CX, cy, R * 0.35, CX, cy, R * 2.0)
    ag.addColorStop(0, `rgba(0,190,255,${0.20 * glow})`)
    ag.addColorStop(0.45, `rgba(0,120,200,${0.10 * glow})`)
    ag.addColorStop(1, 'rgba(0,80,160,0)')
    ctx.fillStyle = ag
    ctx.beginPath(); ctx.arc(CX, cy, R * 2.0, 0, Math.PI*2); ctx.fill()
    ctx.restore()

    // поворот
    const ay = t * 0.45 + (hover ? 0.02 : 0)
    const ax = Math.sin(t * 0.31) * 0.16 - 0.06
    const ca = Math.cos(ay), sa = Math.sin(ay)
    const cb = Math.cos(ax), sb = Math.sin(ax)

    const rot = P.map(([x, y, z]) => {
      let x1 = x * ca + z * sa, z1 = -x * sa + z * ca
      let y1 = y * cb - z1 * sb, z2 = y * sb + z1 * cb
      return [x1, y1, z2]
    })

    const FOC = 3.1
    const proj = p => {
      const s = FOC / (FOC - p[2])
      return [CX + p[0] * R * s, cy + p[1] * R * s, p[2]]
    }
    const pr = rot.map(proj)

    const list = faces.map(([a, b, c]) => {
      const z = (rot[a][2] + rot[b][2] + rot[c][2]) / 3
      const n = norm(cross(
        [rot[b][0]-rot[a][0], rot[b][1]-rot[a][1], rot[b][2]-rot[a][2]],
        [rot[c][0]-rot[a][0], rot[c][1]-rot[a][1], rot[c][2]-rot[a][2]]))
      return { a, b, c, z, n }
    }).sort((p, q) => p.z - q.z)

    // грани: плотные, с тенями на сколах
    ctx.save()
    ctx.lineJoin = 'round'
    const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * Math.max(0, Math.min(1, t))))
    const DARK = [4, 32, 50], MID = [0, 122, 182], LITE = [159, 240, 255]
    for (const f of list) {
      const diff = Math.max(0, dot(f.n, L))
      const rim = Math.pow(1 - Math.abs(dot(f.n, [0, 0, 1])), 3.0)
      const depth = 0.42 + 0.58 * ((f.z + 1.35) / 2.7)
      const front = f.z > -0.05
      let t = (0.10 + diff * 0.52 + rim * 0.30) * depth
      t *= 0.55 + 0.45 * glow
      const base = t < 0.5 ? mix(DARK, MID, t * 2) : mix(MID, LITE, (t - 0.5) * 2)
      ctx.fillStyle = `rgb(${base[0]},${base[1]},${base[2]})`
      ctx.beginPath()
      ctx.moveTo(pr[f.a][0], pr[f.a][1])
      ctx.lineTo(pr[f.b][0], pr[f.b][1])
      ctx.lineTo(pr[f.c][0], pr[f.c][1])
      ctx.closePath()
      ctx.fill()
      // грань-скол: тёмная кромка + светлый блик у ребра
      ctx.strokeStyle = front
        ? `rgba(190,250,255,${0.06 + rim * 0.22})`
        : 'rgba(2,16,26,0.35)'
      ctx.lineWidth = 0.8
      ctx.stroke()
    }
    ctx.restore()

    // внутреннее свечение поверх плотных граней
    ctx.save()
    ctx.globalCompositeOperation = 'lighter'
    const coreR = R * (0.88 + 0.05 * Math.sin(t * 2.6) + pulse * 0.3)
    const cg = ctx.createRadialGradient(CX, cy - R * 0.08, 0, CX, cy - R * 0.08, coreR)
    cg.addColorStop(0, `rgba(235,253,255,${0.55 * glow})`)
    cg.addColorStop(0.18, `rgba(120,235,255,${0.30 * glow})`)
    cg.addColorStop(0.55, `rgba(0,180,240,${0.14 * glow})`)
    cg.addColorStop(1, 'rgba(0,120,200,0)')
    ctx.fillStyle = cg
    ctx.beginPath(); ctx.arc(CX, cy - R * 0.08, coreR, 0, Math.PI*2); ctx.fill()

    // трещины-вены: только те, что смотрят на зрителя
    ctx.lineWidth = 1.0
    for (let i = 0; i < veins.length; i++) {
      const [x, y, z] = veins[i]
      let x1 = x * ca + z * sa, z1 = -x * sa + z * ca
      let y1 = y * cb - z1 * sb, z2 = y * sb + z1 * cb
      if (z2 < 0.15) continue
      const p = proj([x1, y1, z2])
      const grad = ctx.createLinearGradient(CX, cy, p[0], p[1])
      grad.addColorStop(0, `rgba(215,252,255,${0.55 * glow})`)
      grad.addColorStop(0.6, `rgba(80,225,255,${0.20 * glow})`)
      grad.addColorStop(1, 'rgba(0,180,240,0)')
      ctx.strokeStyle = grad
      ctx.beginPath()
      ctx.moveTo(CX + x1 * R * 0.05, cy + y1 * R * 0.05)
      ctx.lineTo(p[0] * 0.995 + CX * 0.005, p[1] * 0.995 + cy * 0.005)
      ctx.stroke()
    }
    ctx.restore()

    // энергетический ручеёк вниз к базе
    ctx.save()
    ctx.globalCompositeOperation = 'lighter'
    const tipY = cy + R * 1.55
    const beam = ctx.createLinearGradient(0, tipY - 40, 0, BASE_Y)
    beam.addColorStop(0, `rgba(160,245,255,${0.42 * glow})`)
    beam.addColorStop(1, 'rgba(0,180,255,0)')
    ctx.fillStyle = beam
    ctx.beginPath()
    ctx.moveTo(CX - 7, tipY - 20); ctx.lineTo(CX + 7, tipY - 20)
    ctx.lineTo(CX + 26, BASE_Y - 4); ctx.lineTo(CX - 26, BASE_Y - 4)
    ctx.closePath(); ctx.fill()
    ctx.restore()

    drawBase(glow)
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
})();
</script>
</body>
</html>
