id: save-loop
type: ui
version: 0.1.0
description: "Сохранение контекста сессии в vault из чата: ⌘⇧S и пункты ⌘K, подсказка на пустом транскрипте. Бэкенд — plugins/save-loop (тот же код, что tools/save_loop.py)"
author: mrkee
license: MIT
platforms: [windows, linux, macos]

requires: []
conflicts: []

capabilities: []

artifacts:
  - kind: python
    src: "@repo/plugins/save-loop"
    dst: plugins/save-loop/
  - kind: desktop
    src: "@repo/desktop-plugins/save-loop"
    dst: desktop-plugins/save-loop/

config:
  plugins.enabled: ["save-loop"]

hooks: []

settings:
  surfaces: "palette, keybinds (mod+shift+s), chat.empty, statusBar.right"
  state_note: "по сохранению обновляется STATE.md (1,9 КБ) — tools/state_note.py; автосейв его не трогает"
  keybind: "mod+shift+s (переназначается в панели горячих клавиш)"
  api: "POST /api/plugins/save-loop/save с confirm:true; GET /verify, /last, /state"
