id: ui-core
type: ui
version: 0.1.0
description: "«Ядро» — шар из ~5000 частиц (косые полосы магента/циан, внутренние искры, дымка дальней стороны): страница /core + пункт сайдбара «Ядро» + ⌘K, плюс слот chat.empty. Чистый canvas 2D без зависимостей и ассетов; клик по шару — импульс энергии"
author: mrkee, СЭМ (SAM)
license: MIT
platforms: [windows, linux, macos]

requires: []
conflicts: []

capabilities: []

artifacts:
  # Только рендер в приложении: python-бэкенда и роутов у модуля нет.
  - kind: desktop
    src: "@repo/desktop-plugins/ui-core/plugin.js"
    dst: desktop-plugins/ui-core/plugin.js

config: {}

hooks: []

settings:
  area: "страница /core — ГЛАВНЫЙ экран (хаб): шар в центре, 6 кнопок по кругу (Чат, Карта проекта, Диспетчер, HermesUI, Задачи, Настройки), от ядра к кнопкам бегут частицы; открывается сама при старте окна (sessionStorage-флаг, один раз). Плюс шар 78px в composер.actions справа от кнопки отправки (бокс 44×40, канвас абсолютный — строка не растёт)"
  size: "композер: 78px в боксе 44×40; страница /core: 42% от min(ширина, высота); док-панель (по ⌘K): 380"
  hub: "кольцо кнопок: 6 разделов без рамок, радиус min(w,h)*0.36; потоки — квадратичные кривые, 46 частиц на связь, размер 0.7-1.4px, профиль конус-дорожка-конус (1−sin), скорость 0.08/0.12/0.16 (покой/ждём/работа), линий нет"
  orbits: "петли в ядре: 4 (78px) / 6 (большой шар) эллипсов с наклоном по X и Z, радиус 0.35R..1.9R с колебанием ±0.24..0.66, 40-64 точки на петлю — часть проходит снаружи шара, часть внутри; цвет петель = цвет ядра, без высветления. Индикатор контекста — тоже цепочка частиц по кольцу 1.12R (26..176 точек, при pr≥0.8 крупнее)"
  hash_fix: "hash() из-за знаковых сдвигов отдавал 0..0.5 (полдиапазона) — половина сферы, петель и разлёта не рисовалась; заменён на imul-хеш, диапазон 0..1"
  transition: "переход в Карту проекта: канвас-слой внутри панели хаба (z-index 40), 1400 частиц; только радиальный разлёт от центра шара с хвостами, без второй фазы; навигация на 55% (≈495мс), гашение к 900мс; хаб гаснет одновременно (opacity 240мс)"
  pace: "спин ядра 0.13/0.34, дрожание частиц 0.9-1.35 Гц — всё медленнее ~2 раза"
  dock_pitfall: "minWidth у openWorkspace применяется только при создании дока; повторное открытие с тем же id ширину не меняет, а закрытие+переоткрытие оставляет старую панель — лишние панели убираются перезапуском окна"
  status: "один цвет на состояние: покой — голубой (64,214,255), идёт ход — янтарь (255,158,62), ждём ответа — магента (255,86,190). Полос нет; яркость только от глубины. У большого шара контекст ≥80% → янтарное кольцо, ≥95% → красное"
  motion: "хаос: у каждой частицы своя 3-осевая траектория (sin/cos с личными частотой и фазой), амплитуда ×1.35 в работе; сверху медленное вращение сферы"
  click: "микро-импульс (частицы разлетаются и собираются) + панель: context_used/max/percent, input→output/total, calls, cost_usd, avg_tps, модель"
  data_source: "host.state.focusedUsage / busy / awaitingResponse / model — живая проекция ядра, без запросов к бэкенду"
  particles: "5100 точек: 4200 оболочка + 900 внутренние искры"
  perf: "144 fps в прототипе на canvas 2D; shadowBlur не используется, ореолы — предрендеренный спрайт"
  prototype: "hermesui/prototypes/orb-v4.html — та же математика, отдельная страница для подбора вида"
  data: "живая: host.state.focusedUsage (контекст, токены, вызовы, стоимость, скорость) + busy/awaitingResponse + model"
