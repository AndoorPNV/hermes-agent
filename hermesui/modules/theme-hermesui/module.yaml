id: theme-hermesui
type: theme
version: 0.1.0
description: "Скин HermesUI: тёплые кофейно-серые (taupe/mocha) тона с латте-акцентом плюс кремово-бежевая светлая пара. Палитра поверх default, layout не трогает"
author: mrkee
license: MIT
platforms: [windows, linux, macos]

requires: []
conflicts: []

capabilities: []

artifacts:
  - kind: skin
    src: theme.yaml
    dst: skins/hermesui.yaml

# Модуль объявляет «наш скин активен». Если переключить скин руками, `plan` снова предложит
# hermesui — это честный дрейф, а не баг. Не нужно — убери ключ из манифеста.
config:
  display.skin: hermesui

hooks: []

settings:
  palette: "dark: taupe/mocha (#121010 base, #C8A98A accent); light: cream (#F7F2EA base, #6E5844 accent); контраст 54/54, худший 4.53"
  overrides: "colors + light_colors + spinner + tool_prefix; branding не трогаем (наследуется от default)"
