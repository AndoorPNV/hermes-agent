id: ui-dispatcher
type: ui
version: 0.1.0
description: "Общий диспетчер: включает и выключает скиллы, плагины, наборы инструментов и MCP для всего Hermes; хранит именованные группы скиллов и плагинов, которые назначаются проектам и сессиям в политике карты проекта"
author: mrkee
license: MIT
platforms: [windows, linux, macos]

requires: []
conflicts: []

capabilities: []

artifacts:
  # Источник один — боевые каталоги репозитория: `@repo/...` считается от корня hermesui/.
  # Дубля кода в modules/ больше нет (был: modules/ui-dispatcher/plugin/, удалён 2026-11-07).
  - kind: desktop
    src: "@repo/desktop-plugins/ui-dispatcher/plugin.js"
    dst: desktop-plugins/ui-dispatcher/plugin.js
  - kind: python
    src: "@repo/plugins/ui-dispatcher"
    dst: plugins/ui-dispatcher/
  - kind: state
    src: "@repo/plugins/ui-dispatcher/groups.json"
    dst: plugins/ui-dispatcher/groups.json

config:
  plugins.enabled: ["ui-dispatcher"]

hooks: []
settings: {}
