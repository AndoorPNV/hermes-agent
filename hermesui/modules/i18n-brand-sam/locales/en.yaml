tips.t043: Ctrl+Z suspends СЭМ to the background — run fg in your shell to resume.
tips.t080: hermes gateway install sets up СЭМ as a system service (systemd/launchd).
tips.t107: execute_code runs Python scripts that call СЭМ tools programmatically — results stay out of context.
tips.t133: When exiting, СЭМ prints a resume command with session ID and stats.
tips.t157: 'СЭМ runs on 21 messaging platforms: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, email, and more.'
tips.t160: BlueBubbles brings iMessage to СЭМ via a local macOS server.
tips.t177: СЭМ loads project context from .hermes.md, AGENTS.md, CLAUDE.md, or .cursorrules (first match).
tips.t208: hermes acp runs СЭМ as an ACP server for VS Code, Zed, and JetBrains integration.
tips.t219: SOUL.md completely replaces the agent's default identity — rewrite it to make СЭМ your own.
tips.t223: Before a gateway session reset, СЭМ auto-flushes important facts to memory in the background.
tips.t285: /goal <text> sets a standing Ralph-loop objective — СЭМ auto-continues turn after turn until a judge says done.
tips.t291: /busy queue|steer|interrupt controls what pressing Enter does while СЭМ is working.
tips.t354: hermes import restores a full СЭМ backup zip; session JSON/JSONL exports import from the dashboard Sessions page.
