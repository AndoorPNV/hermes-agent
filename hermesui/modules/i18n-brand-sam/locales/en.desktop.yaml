settings.appearance.pet.intro: Adopt an animated petdex mascot that floats over the app and reacts to what СЭМ is doing — running while tools execute, celebrating on success, sulking on errors.
settings.appearance.pet.restartHint: Pets need a quick restart — the running app started before this feature was added. Quit and reopen СЭМ, then come back here.
