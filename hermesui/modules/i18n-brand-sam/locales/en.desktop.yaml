settings.config.minimizeToTrayDesc: Minimize windows or close the main window to hide them in the system tray (menu bar on macOS) and keep СЭМ running. Use Quit СЭМ from the tray menu or Cmd+Q to exit. Off by default; applies only to this device.
settings.connections.headersDesc: Sent with every HTTP and WebSocket request to this gateway — for access proxies such as Cloudflare Access (CF-Access-Client-Id / CF-Access-Client-Secret). Values are stored encrypted. Headers СЭМ manages (Authorization, Cookie, Host…) are ignored.
settings.fieldDescriptions.agent.maxTurns: Upper bound for tool-calling turns before СЭМ stops a run.
settings.fieldDescriptions.approvals.mode: How СЭМ handles commands that need explicit approval.
settings.fieldDescriptions.browser.useRealProfile: Local browsing uses your real logins. СЭМ copies your default browser's profile (cookies, logins, preferences) into a managed snapshot and drives it with its packaged Chromium — your live profile is never opened directly, and the copy is refreshed from it on each run. Also lets the agent open a local real-profile session on request even when a cloud browser backend is configured. Only Chromium browsers (Chrome, Edge, Brave, Brave Origin, Chromium) are supported; a non-Chromium default fails with a clear message. Off by default.
settings.fieldDescriptions.fileReadMaxChars: Maximum characters СЭМ can read from one file request.
settings.fieldDescriptions.voice.gptLive.instructions: Extra sentences for the live voice persona (tone, pace, language). СЭМ keeps its own system prompt.
settings.fieldDescriptions.voice.voiceChatMode: 'chained: speech-to-text → СЭМ → text-to-speech with the providers below. gpt-live: one full-duplex OpenAI voice model (gpt-live-1) listens and talks, and hands every real request to СЭМ — any model you have selected answers with the full toolset. Needs an OpenAI API key; the voice layer bills $0.05 per minute.'
